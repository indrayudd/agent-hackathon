services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - sessions:/app/sessions
    restart: unless-stopped
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: agenticeda-nginx
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  sessions:
